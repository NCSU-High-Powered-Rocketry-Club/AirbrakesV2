name: Prek checks

on:
  pull_request:
    branches:
      - '**'  # Matches all branch names, for PRs
  push:
    branches:
      - 'main'  # Run tests on main branch

jobs:
  prek:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2